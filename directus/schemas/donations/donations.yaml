collection: donations
schema: {}
meta:
  icon: payments
  accountability: all
  note: >-
    One share of a checkout per campaign (or without a campaign). Payment state is the checkout's;
    refund state is derived from linked refunds.
fields:
  - field: id
    type: uuid
    schema:
      is_primary_key: true
      is_nullable: false
    meta:
      interface: input
      special:
        - uuid
      hidden: true
  - field: checkout
    type: uuid
    schema:
      is_nullable: false
    meta:
      interface: select-dropdown-m2o
      special:
        - m2o
  - field: campaign
    type: uuid
    schema:
      is_nullable: true
    meta:
      interface: select-dropdown-m2o
      special:
        - m2o
  - field: currency
    type: string
    schema:
      is_nullable: false
      default_value: EUR
    meta:
      interface: select-dropdown
      options:
        choices:
          - text: EUR
            value: EUR
      validation:
        currency:
          _in:
            - EUR
  - field: total_cents
    type: integer
    schema:
      is_nullable: false
      default_value: 0
    meta:
      interface: input
      validation:
        total_cents:
          _gte: 0
  - field: items
    type: alias
    schema: null
    meta:
      special:
        - o2m
      interface: list-o2m
  - field: refunds
    type: alias
    schema: null
    meta:
      special:
        - o2m
      interface: list-o2m
relations:
  - field: checkout
    related_collection: checkouts
    schema:
      on_delete: RESTRICT
    meta:
      one_field: donations
      junction_field: null
  - field: campaign
    related_collection: campaigns
    schema:
      on_delete: RESTRICT
    meta:
      one_field: null
      junction_field: null
