collection: projects
schema: {}
meta:
  icon: volunteer_activism
  accountability: all
fields:
  - field: id
    type: uuid
    schema:
      is_primary_key: true
      is_nullable: false
    meta:
      interface: input
      special:
        - uuid
      hidden: true
  - field: slug
    type: string
    schema:
      is_nullable: false
      is_unique: true
    meta:
      interface: input
  - field: status
    type: string
    schema:
      is_nullable: false
      default_value: draft
    meta:
      interface: select-dropdown
      options:
        choices:
          - text: draft
            value: draft
          - text: published
            value: published
          - text: archived
            value: archived
      validation:
        status:
          _in:
            - draft
            - published
            - archived
  - field: cover_image
    type: uuid
    schema:
      is_nullable: true
    meta:
      interface: select-dropdown-m2o
      special:
        - m2o
  - field: starts_at
    type: timestamp
    schema: {}
    meta:
      interface: datetime
  - field: ends_at
    type: timestamp
    schema: {}
    meta:
      interface: datetime
  - field: translations
    type: alias
    schema: null
    meta:
      special:
        - translations
      interface: translations
      options:
        languageField: name
        defaultLanguage: en
  - field: campaigns
    type: alias
    schema: null
    meta:
      special:
        - m2m
      interface: list-m2m
  - field: purposes
    type: alias
    schema: null
    meta:
      special:
        - o2m
      interface: list-o2m
relations:
  - field: cover_image
    related_collection: directus_files
    schema:
      on_delete: RESTRICT
    meta:
      one_field: null
      junction_field: null
