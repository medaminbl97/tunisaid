role:
  name: Donation service
  icon: support_agent
  description: 'Website server: creates donations and records payments.'
policy:
  name: donation-service-policy
  icon: lock
  admin_access: false
  app_access: false
  description: Least-privilege access for the website donation server.
user:
  email: donation-service@example.com
  first_name: Donation
  last_name: Service
  token_env: DONATION_SERVICE_TOKEN
permissions:
  - collection: donation_purposes
    action: read
    fields:
      - id
      - slug
      - status
      - project
      - unit_amount_cents
      - currency
      - translations
    permissions:
      status:
        _eq: published
  - collection: donation_purposes_translations
    action: read
    fields:
      - id
      - parent
      - language
      - title
      - basket_title
    permissions:
      parent:
        status:
          _eq: published
  - collection: campaigns
    action: read
    fields:
      - id
      - slug
      - status
      - starts_at
      - ends_at
      - goal_cents
      - translations
    permissions:
      status:
        _eq: published
  - collection: campaigns_translations
    action: read
    fields:
      - id
      - parent
      - language
      - title
    permissions:
      parent:
        status:
          _eq: published
  - collection: campaign_projects
    action: read
    fields:
      - id
      - campaign
      - project
    permissions:
      campaign:
        status:
          _eq: published
  - collection: donors
    action: create
    fields:
      - display_name
      - email
      - country_code
      - preferred_language
      - keep_name_private
      - created_at
  - collection: donors
    action: read
    fields:
      - id
  - collection: checkouts
    action: create
    fields:
      - reference
      - donor
      - status
      - currency
      - total_cents
      - created_at
    validation:
      status:
        _eq: pending
  - collection: checkouts
    action: read
    fields:
      - id
      - reference
      - status
      - currency
      - total_cents
      - created_at
      - paid_at
  - collection: checkouts
    action: update
    fields:
      - status
      - paid_at
    permissions:
      status:
        _eq: pending
    validation:
      status:
        _in:
          - pending
          - paid
          - failed
          - cancelled
          - expired
  - collection: donations
    action: create
    fields:
      - checkout
      - campaign
      - currency
      - total_cents
  - collection: donations
    action: read
    fields:
      - id
      - checkout
      - campaign
      - currency
      - total_cents
  - collection: donation_items
    action: create
    fields:
      - donation
      - purpose
      - kind
      - title_snapshot
      - quantity
      - unit_amount_cents
      - total_cents
      - requested_purpose_snapshot
  - collection: donation_items
    action: read
    fields:
      - id
      - donation
      - kind
      - title_snapshot
      - quantity
      - unit_amount_cents
      - total_cents
  - collection: payment_attempts
    action: create
    fields:
      - checkout
      - provider
      - provider_payment_id
      - idempotency_key
      - status
      - amount_cents
      - currency
      - created_at
      - updated_at
    validation:
      status:
        _in:
          - created
          - pending
  - collection: payment_attempts
    action: read
    fields:
      - id
      - checkout
      - provider
      - provider_payment_id
      - status
      - amount_cents
      - currency
      - failure_code
  - collection: payment_attempts
    action: update
    fields:
      - status
      - provider_payment_id
      - failure_code
      - updated_at
    permissions:
      status:
        _in:
          - created
          - pending
  - collection: payment_events
    action: create
    fields:
      - provider
      - provider_event_key
      - event_type
      - payment_attempt
      - status
      - received_at
    validation:
      status:
        _eq: received
  - collection: payment_events
    action: read
    fields:
      - id
      - provider_event_key
      - event_type
      - status
  - collection: payment_events
    action: update
    fields:
      - status
      - processed_at
      - error_code
    permissions:
      status:
        _eq: received
  - collection: refunds
    action: read
    fields:
      - id
      - donation
      - payment_attempt
      - provider_refund_id
      - status
      - amount_cents
  - collection: refunds
    action: create
    fields:
      - donation
      - payment_attempt
      - provider
      - provider_refund_id
      - idempotency_key
      - status
      - amount_cents
      - currency
      - reason_code
      - created_at
    validation:
      status:
        _in:
          - pending
          - succeeded
          - failed
  - collection: refunds
    action: update
    fields:
      - status
    permissions:
      status:
        _eq: pending
    validation:
      status:
        _in:
          - succeeded
          - failed
