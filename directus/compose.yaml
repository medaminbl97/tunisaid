services:
  database:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: tunisaid
      POSTGRES_USER: tunisaid
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run node directus/tools/init-env.mjs first}
    env_file:
      - .env
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tunisaid -d tunisaid']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  directus:
    build:
      context: .
    ports:
      - '127.0.0.1:${DIRECTUS_PORT:-8056}:8055'
    env_file:
      - .env
    environment:
      SECRET: ${DIRECTUS_SECRET:?Run node directus/tools/init-env.mjs first}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in directus/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in directus/.env}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: tunisaid
      DB_USER: tunisaid
      DB_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in directus/.env}
      PUBLIC_URL: http://localhost:${DIRECTUS_PORT:-8056}
      PROJECT_NAME: TunisAid
      TELEMETRY: 'false'
      WEBSOCKETS_ENABLED: 'false'
      CORS_ENABLED: 'true'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      CORS_METHODS: GET
      CACHE_SCHEMA: 'false'
      CMS_ENV: ${CMS_ENV:-dev}
      # Set by `make revision` for its throwaway stack only.
      REVISIONS_ONLY: ${REVISIONS_ONLY:-false}
      SEED_PUBLISH_DEMO: ${SEED_PUBLISH_DEMO:-false}
      DONATION_SERVICE_TOKEN: ${DONATION_SERVICE_TOKEN:-}
    volumes:
      - uploads:/directus/uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8055/server/ping').then(async r => { if (!r.ok || await r.text() !== 'pong') process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30
    restart: unless-stopped

volumes:
  database:
  uploads:
