  - id: b791f54b-6e31-5111-b81c-e92144ee2e42
    parent: 5ec50ebc-5c89-5315-9bd6-3fabf46b3288
    language: en
    title: An inclusive school year
    summary: >-
      School supplies and mobility aids so that children with disabilities can learn alongside their
      classmates.
    body: >-
      <h2>Why this campaign</h2>

      <p>For many children with disabilities in Tunisia, the school year fails on small things:
      missing supplies, or no way to get to class. This campaign bundles two projects that remove
      exactly these barriers.</p>

      <h2>What your gift supports</h2>

      <h3>School supplies</h3>

      <p>Backpacks, notebooks and adapted learning materials, put together with families and partner
      associations.</p>

      <h3>Mobility</h3>

      <p>Electric wheelchairs for students whose journey to school is otherwise not possible on
      their own.</p>

      <h2>How we report back</h2>

      <ul><li>Updates on each project page</li><li>Transparent allocation of every gift</li><li>A
      summary at the end of the school year</li></ul>

      <p><em>Demo campaign for local development. Goal, dates and copy are illustrative and not a
      real fundraising appeal.</em></p>
  - id: 049099ca-2bf0-5e31-869b-5b351a9abdbe
    parent: 5ec50ebc-5c89-5315-9bd6-3fabf46b3288
    language: de
    title: Ein inklusives Schuljahr
    summary: >-
      Schulmaterial und Mobilitätshilfen, damit Kinder mit Behinderungen gemeinsam mit ihren
      Mitschülerinnen und Mitschülern lernen können.
    body: >-
      <h2>Warum diese Kampagne</h2>

      <p>Für viele Kinder mit Behinderungen in Tunesien scheitert das Schuljahr an kleinen Dingen:
      fehlendes Material oder kein Weg zur Schule. Diese Kampagne bündelt zwei Projekte, die genau
      diese Hürden abbauen.</p>

      <h2>Was deine Spende bewirkt</h2>

      <h3>Schulmaterial</h3>

      <p>Rucksäcke, Hefte und angepasste Lernmaterialien, zusammengestellt mit Familien und
      Partnervereinen.</p>

      <h3>Mobilität</h3>

      <p>Elektrorollstühle für Schülerinnen und Schüler, die den Schulweg sonst nicht selbstständig
      schaffen.</p>

      <h2>Wie wir berichten</h2>

      <ul><li>Updates auf jeder Projektseite</li><li>Transparente Zuordnung jeder
      Spende</li><li>Eine Zusammenfassung am Ende des Schuljahres</li></ul>

      <p><em>Demo-Kampagne für die lokale Entwicklung. Ziel, Zeitraum und Texte sind beispielhaft
      und kein echter Spendenaufruf.</em></p>
  - id: 4b487a7e-2fdb-53f6-80ae-e6e06a630362
    parent: fd7f7497-11a4-547e-a609-b966cc2b5af5
    language: en
    title: Ramadan 2027 food boxes
    summary: >-
      Grocery boxes for families that include people with disabilities, delivered before and during
      Ramadan.
    body: >-
      <h2>The idea</h2>

      <p>Ramadan is a time of sharing. Together with local partners we put together food boxes with
      staple groceries and deliver them to families who need them most.</p>

      <h2>What is in a box</h2>

      <p>Flour, oil, semolina, pasta, dates, tomato paste and other staples for a family for several
      weeks.</p>

      <blockquote><p>Every box is put together and handed over by volunteers in the
      region.</p></blockquote>

      <p><em>Demo campaign for local development. Goal, dates and copy are illustrative and not a
      real fundraising appeal.</em></p>
  - id: 56ebf878-acb2-5c45-b147-3b408776423d
    parent: fd7f7497-11a4-547e-a609-b966cc2b5af5
    language: de
    title: Lebensmittelpakete Ramadan 2027
    summary: >-
      Lebensmittelpakete für Familien, in denen Menschen mit Behinderungen leben, verteilt vor und
      während des Ramadan.
    body: >-
      <h2>Die Idee</h2>

      <p>Ramadan ist eine Zeit des Teilens. Gemeinsam mit lokalen Partnern stellen wir Pakete mit
      Grundnahrungsmitteln zusammen und bringen sie zu Familien, die sie am dringendsten
      brauchen.</p>

      <h2>Was in einem Paket ist</h2>

      <p>Mehl, Öl, Grieß, Nudeln, Datteln, Tomatenmark und weitere Grundnahrungsmittel für eine
      Familie für mehrere Wochen.</p>

      <blockquote><p>Jedes Paket wird von Freiwilligen in der Region gepackt und
      übergeben.</p></blockquote>

      <p><em>Demo-Kampagne für die lokale Entwicklung. Ziel, Zeitraum und Texte sind beispielhaft
      und kein echter Spendenaufruf.</em></p>
